              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access token (admin routes require admin_users).
    metricsTokenAuth:
      type: http
      scheme: bearer
      description: METRICS_TOKEN bearer for Prometheus scrapes.
    cronSecretAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Bearer ANALYTICS_CRON_SECRET (or project cron auth).
    bootstrapSecretAuth:
      type: apiKey
      in: header
      name: x-admin-bootstrap-secret
      description: Optional ADMIN_BOOTSTRAP_SECRET for board bootstrap.
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
        request_id:
          type: string
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        request_id:
          type: string
      additionalProperties: true
    AnalyticsEventsBatch:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
        sent_at:
          type: string
          format: date-time
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AnalyticsEvent"
      additionalProperties: false
    AnalyticsEvent:
      type: object
      required: [event_id, event_name, session_id, occurred_at]
      properties:
        event_id:
          type: string
        event_name:
          type: string
          description: Must be on the server allowlist (see ANALYTICS_EVENTS_API.md).
        event_version:
          type: integer
          minimum: 1
        anonymous_id:
          type: string
          description: Required when no bearer token is present.
        session_id:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        source:
          type: string
          enum: [mobile, web, backend, admin]
        source_type:
          type: [string, "null"]
          enum: [search, map, feed, video, post, content, route, creator, recommendation, profile, direct_link, null]
          description: Normalized discovery/attribution source type.
        source_id:
          type: [string, "null"]
          description: Source entity ID, for example the video or route that generated the action.
        platform:
          type: string
          enum: [ios, android, web, server]
        app_version:
          type: string
        build_number:
          type: string
        device_os:
          type: string
        locale:
          type: string
        timezone:
          type: string
        country:
          type: string
        region:
          type: [string, "null"]
        city:
          type: [string, "null"]
        geo_id:
          type: [string, "null"]
          format: uuid
          description: Normalized destination geography when known.
        properties:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
      additionalProperties: true
    AnalyticsEventsResponse:
      type: object
      required: [ok, request_id, accepted, duplicates, rejected]
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        accepted:
          type: integer
        duplicates:
          type: integer
        rejected:
          type: integer
        warnings:
          type: array
          items:
            type: string
      additionalProperties: true
