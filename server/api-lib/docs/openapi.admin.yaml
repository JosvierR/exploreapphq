openapi: 3.1.0
info:
  title: Explore Admin HTTP API
  version: 1.0.0
  description: |
    Hand-authored OpenAPI for the Explore web `/api/*` surface (Vercel `router.mjs`
    + local Express). PostgREST and Edge Functions are separate Scalar sources.

    `POST /api/events` matches `docs/ANALYTICS_EVENTS_API.md`.
servers:
  - url: /
    description: Same origin (Vercel production or local Vite proxy)
tags:
  - name: Health
  - name: Moderation
  - name: Analytics
  - name: Admin Analytics
  - name: Business Insights
  - name: Business Intelligence
  - name: System
  - name: Docs
  - name: Waitlist
  - name: Pioneers
  - name: Feedback
security: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: API health probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/reports:
    post:
      tags: [Moderation]
      summary: Submit a content report
      operationId: postReports
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/hidden-content:
    get:
      tags: [Moderation]
      summary: List content hidden by the current user
      operationId: getUserHiddenContent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hidden content list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Moderation]
      summary: Hide content for the current user
      operationId: postUserHiddenContent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Content hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/hidden-content/unhide:
    post:
      tags: [Moderation]
      summary: Unhide previously hidden content
      operationId: postUserHiddenContentUnhide
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Content unhidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/me:
    get:
      tags: [Moderation]
      summary: Current admin identity
      operationId: getAdminMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/admins:
    get:
      tags: [Moderation]
      summary: List admin roster
      operationId: getAdminRoster
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin users from admin_users
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Moderation]
      summary: Add or upsert an admin by email
      operationId: postAdminRoster
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, moderator]
      responses:
        "200":
          description: Admin upserted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Auth user not found for email
    patch:
      tags: [Moderation]
      summary: Update an admin role
      operationId: patchAdminRoster
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [admin, moderator]
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Moderation]
      summary: Remove an admin from the roster
      operationId: deleteAdminRoster
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Admin removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

