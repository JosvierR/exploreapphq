        "200":
          description: Dead-letter rows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/analytics/aggregate:
    post:
      tags: [Admin Analytics]
      summary: Manually trigger analytics aggregation
      operationId: postAdminAnalyticsAggregate
      security:
        - bearerAuth: []
      responses:
        "200":
