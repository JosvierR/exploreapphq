      summary: Public waitlist signup
      operationId: postWaitlistSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Signup result
          content:
            application/json:
              schema:
