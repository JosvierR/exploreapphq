openapi: 3.1.0
info:
  title: Explore Admin HTTP API
  version: 1.0.0
  description: |
    Hand-authored OpenAPI for the Explore web `/api/*` surface (Vercel `router.mjs`
    + local Express). PostgREST and Edge Functions are separate Scalar sources.

    `POST /api/events` matches `docs/ANALYTICS_EVENTS_API.md`.
servers:
  - url: /
    description: Same origin (Vercel production or local Vite proxy)
tags:
  - name: Health
  - name: Moderation
  - name: Analytics
  - name: Admin Analytics
  - name: Business Insights
  - name: System
  - name: Docs
  - name: Waitlist
  - name: Pioneers
  - name: Feedback
security: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: API health probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/reports:
    post:
      tags: [Moderation]
      summary: Submit a content report
      operationId: postReports
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/hidden-content:
    get:
      tags: [Moderation]
      summary: List content hidden by the current user
      operationId: getUserHiddenContent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hidden content list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Moderation]
      summary: Hide content for the current user
      operationId: postUserHiddenContent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Content hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/hidden-content/unhide:
    post:
      tags: [Moderation]
      summary: Unhide previously hidden content
      operationId: postUserHiddenContentUnhide
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Content unhidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/me:
    get:
      tags: [Moderation]
      summary: Current admin identity
      operationId: getAdminMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/reports:
    get:
      tags: [Moderation]
      summary: List moderation reports
      operationId: getAdminReports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Report queue
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/reports/{id}:
    get:
      tags: [Moderation]
      summary: Get a moderation report by id
      operationId: getAdminReportById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Moderation]
      summary: Update a moderation report
      operationId: patchAdminReportById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/moderation/summary:
    get:
      tags: [Moderation]
      summary: Moderation summary counters
      operationId: getAdminModerationSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/ops/summary:
    get:
      tags: [Moderation]
      summary: Ops summary for the admin console
      operationId: getAdminOpsSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ops summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users:
    get:
      tags: [Moderation]
      summary: List admin-visible users
      operationId: getAdminUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
