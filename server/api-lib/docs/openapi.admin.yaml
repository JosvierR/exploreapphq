  /api/admin/moderation/action:
    post:
      tags: [Moderation]
      summary: Apply a moderation action
      operationId: postAdminModerationAction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/events:
    post:
      tags: [Analytics]
      summary: Ingest analytics event batch
      description: |
        Mobile/web clients send analytics batches. Contract mirrors
        `docs/ANALYTICS_EVENTS_API.md`. Optional bearer token; anonymous
        batches require `anonymous_id`. Max 50 events / 256 KB.
      operationId: postAnalyticsEvents
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventsBatch"
            example:
              batch_id: batch-uuid
              sent_at: "2026-07-02T10:00:00.000Z"
              events:
                - event_id: event-uuid
                  event_name: video_view_start
                  event_version: 1
                  anonymous_id: stable-anonymous-id
                  session_id: session-id
                  entity_type: video
                  entity_id: video-id
                  occurred_at: "2026-07-02T09:59:58.000Z"
                  platform: ios
                  app_version: "1.0.0"
                  build_number: "100"
                  locale: es-DO
                  timezone: America/Santo_Domingo
                  country: DO
                  properties: {}
                  context: {}
      responses:
        "200":
          description: Batch processed (may include partial rejects)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Analytics schema or Supabase not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cron/analytics/aggregate:
    post:
      tags: [Analytics]
      summary: Cron trigger for analytics aggregates
      operationId: postCronAnalyticsAggregate
      security:
        - cronSecretAuth: []
      responses:
        "200":
          description: Aggregation completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/analytics/overview:
    get:
      tags: [Admin Analytics]
      summary: Analytics overview
      operationId: getAdminAnalyticsOverview
      security:
