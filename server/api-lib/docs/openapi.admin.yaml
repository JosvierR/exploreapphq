  /api/admin/waitlist/notify-launch:
    post:
      tags: [Waitlist]
      summary: Email waitlist that the app is ready
      operationId: postAdminWaitlistNotifyLaunch
      security:
        - bearerAuth: []
      parameters:
        - name: dryRun
          in: query
          schema:
            type: string
            enum: ["1"]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
              additionalProperties: true
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/broadcast:
    post:
      tags: [Waitlist]
      summary: Broadcast email/SMS to waitlist
      operationId: postAdminBroadcast
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Broadcast result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pioneers/landing:
    get:
      tags: [Pioneers]
      summary: Pioneers landing payload
      operationId: getPioneersLanding
      responses:
        "200":
          description: Landing content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/feedback/submit:
    post:
      tags: [Feedback]
      summary: Submit public product feedback
      operationId: postFeedbackSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, category]
              properties:
                message:
                  type: string
                category:
                  type: string
                  enum: [idea, bug, love, other]
                name:
                  type: string
                email:
                  type: string
                  format: email
              additionalProperties: true
      responses:
        "200":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access token (admin routes require admin_users).
    metricsTokenAuth:
      type: http
      scheme: bearer
      description: METRICS_TOKEN bearer for Prometheus scrapes.
    cronSecretAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Bearer ANALYTICS_CRON_SECRET (or project cron auth).
    bootstrapSecretAuth:
      type: apiKey
      in: header
      name: x-admin-bootstrap-secret
      description: Optional ADMIN_BOOTSTRAP_SECRET for board bootstrap.
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
        request_id:
          type: string
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        request_id:
          type: string
      additionalProperties: true
    AnalyticsEventsBatch:
      type: object
      required: [events]
      properties:
        batch_id:
          type: string
        sent_at:
          type: string
          format: date-time
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AnalyticsEvent"
      additionalProperties: false
    AnalyticsEvent:
      type: object
      required: [event_id, event_name, session_id, occurred_at]
      properties:
        event_id:
          type: string
        event_name:
          type: string
          description: Must be on the server allowlist (see ANALYTICS_EVENTS_API.md).
        event_version:
          type: integer
          minimum: 1
        anonymous_id:
          type: string
          description: Required when no bearer token is present.
        session_id:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        source:
          type: string
          enum: [mobile, web, backend, admin]
        platform:
          type: string
          enum: [ios, android, web]
        app_version:
          type: string
        build_number:
          type: string
        device_os:
          type: string
        locale:
          type: string
        timezone:
          type: string
        country:
          type: string
        region:
          type: [string, "null"]
        city:
          type: [string, "null"]
        properties:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
      additionalProperties: true
    AnalyticsEventsResponse:
      type: object
      required: [ok, request_id, accepted, duplicates, rejected]
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        accepted:
          type: integer
        duplicates:
          type: integer
        rejected:
          type: integer
        warnings:
          type: array
          items:
            type: string
      additionalProperties: true
