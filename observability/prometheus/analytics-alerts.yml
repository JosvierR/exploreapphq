groups:
  - name: explore-analytics-ingestion
    interval: 1m
    rules:
      - alert: ExploreAnalyticsRejectionRateWarning
        expr: |
          (
            sum(increase(explore_analytics_events_rejected_total[15m]))
            /
            clamp_min(
              sum(increase(explore_analytics_events_accepted_total[15m]))
              + sum(increase(explore_analytics_events_rejected_total[15m])),
              1
            )
          ) >= 0.05
          and
          (
            sum(increase(explore_analytics_events_accepted_total[15m]))
            + sum(increase(explore_analytics_events_rejected_total[15m]))
          ) >= 20
        for: 10m
        labels:
          severity: warning
          service: explore-web-admin
        annotations:
          summary: Explore analytics rejection rate is elevated
          description: At least 5% of 20 or more observed ingestion attempts were rejected over 15 minutes.

      - alert: ExploreAnalyticsRejectionRateCritical
        expr: |
          (
            sum(increase(explore_analytics_events_rejected_total[10m]))
            /
            clamp_min(
              sum(increase(explore_analytics_events_accepted_total[10m]))
              + sum(increase(explore_analytics_events_rejected_total[10m])),
              1
            )
          ) >= 0.20
          and
          (
            sum(increase(explore_analytics_events_accepted_total[10m]))
            + sum(increase(explore_analytics_events_rejected_total[10m]))
          ) >= 20
        for: 5m
        labels:
          severity: critical
          service: explore-web-admin
        annotations:
          summary: Explore analytics rejection rate is critical
          description: At least 20% of 20 or more observed ingestion attempts were rejected over 10 minutes.

      - alert: ExploreAnalyticsPossibleOutage
        expr: |
          sum(increase(explore_analytics_events_accepted_total[1h])) == 0
          and sum(increase(explore_analytics_events_accepted_total[24h])) >= 100
        for: 15m
        labels:
          severity: critical
          service: explore-web-admin
        annotations:
          summary: Explore analytics has no accepted events
          description: No event was accepted for one hour despite established daily traffic.

      - alert: ExploreAnalyticsAuthenticationFailures
        expr: sum(increase(explore_auth_failures_total{route="/api/events"}[15m])) >= 10
        for: 5m
        labels:
          severity: warning
          service: explore-web-admin
        annotations:
          summary: Analytics authentication failures increased
          description: Ten or more 401/403 responses were observed for the ingestion endpoint over 15 minutes.

      - alert: ExploreAnalyticsIngestLatency
        expr: max(explore_analytics_ingest_duration_ms_p95) > 1500
        for: 10m
        labels:
          severity: warning
          service: explore-web-admin
        annotations:
          summary: Analytics ingestion latency is high
          description: Per-instance ingestion p95 exceeded 1.5 seconds for ten minutes.
