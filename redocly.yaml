# Redocly governance for all three API documentation surfaces.
apis:
  explore-admin:
    root: server/api-lib/docs/openapi.admin.yaml
  explore-edge:
    root: server/api-lib/docs/openapi.edge.yaml

extends:
  - recommended

rules:
  # Hand-authored ops surface documents primary methods; many Express mounts are app.all.
  operation-operationId: error
  no-unused-components: warn
  info-license: off
  info-contact: off
  tag-description: off
  operation-4xx-response: off
